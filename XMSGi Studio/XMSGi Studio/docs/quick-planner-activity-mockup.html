<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Planner Activity Mockup</title>
    <style>
      :root {
        --bg: #edf5fb;
        --bg-strong: #dfeef8;
        --panel: rgba(255, 255, 255, 0.72);
        --panel-strong: rgba(255, 255, 255, 0.92);
        --border: rgba(82, 122, 157, 0.18);
        --text: #1f2d3a;
        --muted: #5f707d;
        --muted-2: #7e8f9d;
        --blue: #2893f3;
        --blue-2: #6ec2ff;
        --blue-3: #99d8ff;
        --green: #6dd0a6;
        --amber: #f5bb5c;
        --shadow: rgba(35, 77, 104, 0.16);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Inter, Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(120, 195, 255, 0.26), transparent 32%),
          radial-gradient(circle at bottom right, rgba(112, 160, 255, 0.18), transparent 28%),
          linear-gradient(180deg, #edf5fb 0%, #dfeef9 100%);
        color: var(--text);
      }

      .canvas {
        width: min(980px, 92vw);
      }

      .activity-card {
        position: relative;
        padding: 20px 18px 16px;
        border: 1px solid var(--border);
        border-radius: 22px;
        background:
          radial-gradient(ellipse at 16% 0%, rgba(255,255,255,0.95), transparent 40%),
          linear-gradient(135deg, rgba(255,255,255,0.92), rgba(224,240,253,0.9));
        box-shadow:
          0 18px 40px rgba(35, 84, 118, 0.1),
          0 6px 18px rgba(35, 84, 118, 0.07),
          inset 0 1px 0 rgba(255,255,255,0.7);
        overflow: hidden;
      }

      .activity-card::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 120px;
        background: linear-gradient(180deg, rgba(127, 196, 255, 0.10), transparent);
        pointer-events: none;
      }

      .activity-header {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }

      .section-title {
        margin: 0;
        font-size: 15px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
      }

      .period-switcher {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        border-radius: 12px;
        background: rgba(120, 154, 182, 0.10);
        border: 1px solid rgba(110, 143, 171, 0.12);
      }

      .period-btn {
        border: 0;
        border-radius: 9px;
        padding: 7px 12px;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        cursor: pointer;
      }

      .period-btn.active {
        background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(233,245,255,0.92));
        color: var(--blue);
        box-shadow: 0 2px 10px rgba(40, 147, 243, 0.15);
      }

      .summary-row {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1.2fr 1fr;
        gap: 18px;
        align-items: end;
        margin-bottom: 18px;
      }

      .kpi-block {
        display: flex;
        align-items: end;
        gap: 12px;
        min-width: 0;
      }

      .kpi-number {
        font-size: clamp(34px, 4vw, 56px);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 800;
        color: var(--text);
      }

      .kpi-label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding-left: 12px;
        border-left: 1px solid rgba(87, 113, 135, 0.18);
      }

      .kpi-label .tiny {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .kpi-label .big {
        font-size: 13px;
        font-weight: 700;
        color: var(--muted-2);
      }

      .inline-insights {
        display: flex;
        gap: 8px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .insight-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        background: rgba(255,255,255,0.68);
        border: 1px solid rgba(107, 162, 210, 0.18);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
      }

      .insight-pill .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: linear-gradient(180deg, #7ad6ff, #1e9bf7);
        box-shadow: 0 0 0 6px rgba(41, 147, 243, 0.08);
      }

      .insight-pill strong {
        font-size: 13px;
        color: var(--text);
      }

      .insight-pill span {
        font-size: 11px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }

      .chart-panel {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: 1fr 240px;
        gap: 16px;
        align-items: stretch;
      }

      .chart-box {
        position: relative;
        padding: 18px 18px 10px;
        border-radius: 20px;
        border: 1px solid rgba(102, 146, 179, 0.18);
        background: linear-gradient(180deg, rgba(255,255,255,0.60), rgba(232,246,255,0.65));
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      }

      .chart-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .chart-head .label {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 800;
      }

      .chart-head .trend {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(26, 188, 120, 0.09);
        color: #1d8a5f;
        font-weight: 700;
        font-size: 12px;
      }

      .trend .up {
        width: 8px;
        height: 8px;
        border-left: 2px solid currentColor;
        border-top: 2px solid currentColor;
        transform: rotate(45deg);
      }

      .chart {
        position: relative;
        height: 180px;
        border-radius: 16px;
        background:
          linear-gradient(180deg, rgba(130, 181, 237, 0.08), rgba(130,181,237,0)),
          linear-gradient(180deg, rgba(255,255,255,0.3), rgba(255,255,255,0.05));
        overflow: hidden;
      }

      .chart-grid {
        position: absolute;
        inset: 12px 18px 22px 18px;
        background-image:
          linear-gradient(to top, rgba(122, 153, 178, 0.14) 1px, transparent 1px),
          linear-gradient(to right, rgba(122, 153, 178, 0.14) 1px, transparent 1px);
        background-size: 25% 25%, 14.285% 100%;
        border-radius: 12px;
      }

      .chart-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      .chart-bars {
        position: absolute;
        inset: 0 0 0 0;
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 8px;
        padding: 28px 18px 18px;
      }

      .bar {
        position: relative;
        flex: 1;
        max-width: 28px;
        border-radius: 12px 12px 0 0;
        background: linear-gradient(180deg, rgba(120, 210, 255, 0.95), rgba(43, 124, 245, 0.92));
        box-shadow: 0 12px 18px rgba(35, 124, 226, 0.12);
      }

      .bar:nth-child(2n) {
        background: linear-gradient(180deg, rgba(162, 222, 255, 0.9), rgba(28, 134, 233, 0.82));
      }

      .bar:nth-child(3n) {
        background: linear-gradient(180deg, rgba(110, 201, 255, 0.95), rgba(17, 104, 206, 0.88));
      }

      .bar span {
        position: absolute;
        left: 50%;
        bottom: calc(100% + 8px);
        transform: translateX(-50%);
        font-size: 11px;
        font-weight: 700;
        color: var(--muted);
      }

      .side-panel {
        display: grid;
        gap: 12px;
      }

      .mini-stat {
        padding: 14px 14px 12px;
        border: 1px solid rgba(96, 147, 185, 0.18);
        border-radius: 16px;
        background: linear-gradient(180deg, rgba(255,255,255,0.60), rgba(233,246,255,0.7));
      }

      .mini-stat .small-label {
        display: block;
        margin-bottom: 8px;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: var(--muted);
        font-weight: 800;
      }

      .mini-stat strong {
        display: block;
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .mini-stat em {
        display: inline-block;
        margin-top: 6px;
        font-style: normal;
        font-size: 12px;
        font-weight: 700;
        color: var(--muted);
      }

      .mini-stat.warning strong {
        color: #cb7a0d;
      }

      .mini-stat.success strong {
        color: #1f8a67;
      }

      .bottom-metrics {
        position: relative;
        z-index: 1;
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-top: 18px;
      }

      .metric-card {
        padding: 14px 16px;
        border: 1px solid rgba(102, 146, 179, 0.18);
        border-radius: 16px;
        background: rgba(255,255,255,0.55);
        box-shadow: inset 0 1px 0 rgba(255,255,255,0.6);
      }

      .metric-card .metric-name {
        display: block;
        margin-bottom: 8px;
        font-size: 10px;
        letter-spacing: 0.13em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 800;
      }

      .metric-card strong {
        display: block;
        font-size: 28px;
        line-height: 1;
        letter-spacing: -0.05em;
      }

      .metric-card small {
        display: block;
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted-2);
      }

      @media (max-width: 760px) {
        .summary-row,
        .chart-panel,
        .bottom-metrics {
          grid-template-columns: 1fr;
        }

        .inline-insights {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <section class="activity-card" aria-label="Макет активности планнера">
        <header class="activity-header">
          <h2 class="section-title">Активность</h2>
          <div class="period-switcher" aria-label="Период активности">
            <button class="period-btn active" type="button">7d</button>
            <button class="period-btn" type="button">30d</button>
          </div>
        </header>

        <div class="summary-row">
          <div class="kpi-block">
            <div class="kpi-number">146</div>
            <div class="kpi-label">
              <span class="tiny">Отправлено</span>
              <span class="big">за последние 7 дней</span>
            </div>
          </div>

          <div class="inline-insights">
            <div class="insight-pill">
              <span class="dot"></span>
              <strong>21</strong>
              <span>в день</span>
            </div>
            <div class="insight-pill">
              <span class="dot"></span>
              <strong>8</strong>
              <span>пик</span>
            </div>
            <div class="insight-pill">
              <span class="dot"></span>
              <strong>16:00</strong>
              <span>следующее</span>
            </div>
          </div>
        </div>

        <div class="chart-panel">
          <div class="chart-box">
            <div class="chart-head">
              <span class="label">Расписание</span>
              <span class="trend"><span class="up"></span> +18%</span>
            </div>

            <div class="chart" aria-label="График активности">
              <div class="chart-grid"></div>
              <div class="chart-bars" aria-hidden="true">
                <div class="bar" style="height: 20%;"><span>Пн</span></div>
                <div class="bar" style="height: 34%;"><span>Вт</span></div>
                <div class="bar" style="height: 52%;"><span>Ср</span></div>
                <div class="bar" style="height: 72%;"><span>Чт</span></div>
                <div class="bar" style="height: 56%;"><span>Пт</span></div>
                <div class="bar" style="height: 82%;"><span>Сб</span></div>
                <div class="bar" style="height: 100%;"><span>Вс</span></div>
              </div>
            </div>
          </div>

          <div class="side-panel">
            <div class="mini-stat warning">
              <span class="small-label">Лучший день</span>
              <strong>8</strong>
              <em>воскресенье</em>
            </div>
            <div class="mini-stat success">
              <span class="small-label">Запланировано</span>
              <strong>19</strong>
              <em>на ближайшие 3 дня</em>
            </div>
          </div>
        </div>

        <div class="bottom-metrics">
          <div class="metric-card">
            <span class="metric-name">Среднее / день</span>
            <strong>21</strong>
            <small>показывает стабильность</small>
          </div>
          <div class="metric-card">
            <span class="metric-name">Лучший период</span>
            <strong>4d</strong>
            <small>высокая активность подряд</small>
          </div>
          <div class="metric-card">
            <span class="metric-name">План на завтра</span>
            <strong>12</strong>
            <small>ожидается отправка</small>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
