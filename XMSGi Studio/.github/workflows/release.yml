name: Release

# Авто-релиз: сборка артефактов и публикация в GitHub Releases.
# Запускается ТОЛЬКО по тегу вида v* (например v1.2.0) или вручную.
# Проверки кода (lint/type/test) выполняются в release-check.yml — здесь их нет,
# чтобы релиз не зависел от повторного прогона тестов.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.2.1'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'XMSGi Studio/package-lock.json'

      - name: Install dependencies
        working-directory: XMSGi Studio
        run: npm ci

      - name: Lint
        working-directory: XMSGi Studio
        run: npm run lint

      - name: Typecheck
        working-directory: XMSGi Studio
        run: npm run typecheck

      - name: Test
        working-directory: XMSGi Studio
        run: npm test -- --reporter=dot

  build:
    name: Build ${{ matrix.artifact_name }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform: win
            targets: portable --x64
            artifact_name: windows-x64
            artifact_path: XMSGi Studio/release/*.exe
          - runner: ubuntu-latest
            platform: linux
            targets: AppImage deb --x64
            artifact_name: linux-x64
            artifact_path: |
              XMSGi Studio/release/*.AppImage
              XMSGi Studio/release/*.deb
          - runner: macos-latest
            platform: mac
            targets: dmg zip --x64 --arm64
            artifact_name: macos-x64-arm64
            artifact_path: |
              XMSGi Studio/release/*.dmg
              XMSGi Studio/release/*.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Для workflow_dispatch собираем тот тег, который указали вручную.
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'XMSGi Studio/package-lock.json'

      - name: Install dependencies
        working-directory: XMSGi Studio
        run: npm ci

      - name: Build application
        working-directory: XMSGi Studio
        run: npm run build

      - name: Package for platform
        working-directory: XMSGi Studio
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.platform != 'mac' }}
        # --publish never: публикацию делает отдельный шаг softprops/action-gh-release,
        # иначе electron-builder попытается сам создать релиз из каждой ОС и получится путаница.
        run: npx electron-builder --${{ matrix.platform }} ${{ matrix.targets }} --publish never

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: XMSGi-Studio-${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Для workflow_dispatch тег берём из input, иначе из ref события.
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          # Тег уже существует (создан локально и запушен) — не создаём новый.
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist-artifacts/**/*.exe
            dist-artifacts/**/*.AppImage
            dist-artifacts/**/*.deb
            dist-artifacts/**/*.dmg
            dist-artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
